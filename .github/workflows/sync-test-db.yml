name: Sync Test Database

on:
  push:
    branches: [teste]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  sync:
    name: Apply migrations → BD Teste
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN está vazio — secret não encontrado no GitHub"
            exit 1
          else
            echo "✅ SUPABASE_ACCESS_TOKEN está definido (${#SUPABASE_ACCESS_TOKEN} caracteres)"
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "⚠️  SUPABASE_TEST_DB_PASSWORD está vazio"
          else
            echo "✅ SUPABASE_TEST_DB_PASSWORD está definido"
          fi

      - name: Link to test project
        run: supabase link --project-ref wiwvpokdbklathfkjmzl

      - name: Push pending migrations
        run: supabase db push --linked

      - name: Summary
        if: always()
        run: |
          echo "### Sync BD Teste ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Projeto:** wiwvpokdbklathfkjmzl" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "- **Migrations:** $(ls supabase/migrations/ | wc -l) arquivos no repositório" >> $GITHUB_STEP_SUMMARY
